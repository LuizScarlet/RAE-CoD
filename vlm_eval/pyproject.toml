[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-sem-dist"
version = "1.0.0"
description = "Blinded SR/SQ/SC evaluation for reconstructed images with Qwen3.5"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "huggingface-hub>=1.3,<2",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "torch>=2.4",
  "transformers>=5.15,<5.16",
]

[project.optional-dependencies]
runtime = ["vllm>=0.27,<0.28"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vlm-sem-dist = "vlm_sem_dist.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
