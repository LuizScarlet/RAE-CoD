class_path: src.training.RAECoDTrainer
init_args:
  lambda_rate: 24.0
  lambda_rate_schedule:
    - [0, 0.1]
    - [20000, 2.0]
    - [30000, 12.0]
    - [60000, 16.0]
    - [90000, 24.0]
    - [120000, 32.0]
    - [150000, 48.0]
  lambda_aux_cos: 0.5
  t_eps: 0.05
  base_model_coeff: 1.0
  cfg_dropout_prob: 0.1
  prediction: x
  lognorm_t: true
  encoder:
    class_path: src.models.dinov3.DINOv3MultiLayer
    init_args:
      ckpt_dir: ""
      repo_dir: ""
      model_name: dinov3_vitl16
      layer_indices: [11, 13, 15, 17, 19, 21, 23]
  normalization_stat_path: null
  timeshift: 8.0
