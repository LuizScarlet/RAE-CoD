# Tested with lightning.pytorch==2.5.0.post0
seed_everything: true
tags:
  exp: RAE-CoD
torch_hub_dir: null
huggingface_cache_dir: null
pretrained_ckpt_path: null

trainer:
  default_root_dir: null
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  num_sanity_val_steps: 0
  check_val_every_n_epoch: null
  inference_mode: true
  log_every_n_steps: 50
  use_distributed_sampler: false
  accumulate_grad_batches: 1

model:
  denoiser:
    load: src/configs/model.yaml
  vae:
    class_path: src.rae_decoder.RAEDecoder
    init_args:
      decoder_config:
        decoder_hidden_size: 1152
        decoder_num_hidden_layers: 28
        decoder_num_attention_heads: 16
        decoder_intermediate_size: 4096
      pretrained_decoder_path: null
      normalization_stat_path: null
      encoder_hidden_size: 1024
      decoder_patch_size: 16
      image_size: 256
      num_patches: 256
  diffusion_trainer:
    load: src/configs/diffusion_trainer.yaml
  diffusion_sampler:
    load: src/configs/diffusion_sampler.yaml
  ema_tracker:
    class_path: src.callbacks.simple_ema.SimpleEMA
    init_args:
      decay: 0.9995
